name: Codex PR Review

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request
    if: ${{ github.event.pull_request.draft == false && vars.CODEX_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Check out base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Build PR review context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CONTEXT_PATH: .github/codex/pr-context.md
          PR_HEAD_PATH: .github/codex/pr-head
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const pr = context.payload.pull_request;
            if (!pr.head.repo) throw new Error('PR head repository is unavailable.');

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (files.length > 500) throw new Error(`PR changes ${files.length} files; review limit is 500.`);
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const prHeadRoot = path.resolve(process.env.PR_HEAD_PATH);
            const [headOwner, headRepo] = pr.head.repo.full_name.split('/');
            const materializedHeadFiles = new Set();
            const maxFileBytes = 1_000_000;
            const maxTotalBytes = 20_000_000;
            let materializedBytes = 0;
            fs.mkdirSync(prHeadRoot, { recursive: true });

            const safeHeadFilePath = (filename) => {
              const target = path.resolve(prHeadRoot, filename);
              if (target !== prHeadRoot && !target.startsWith(`${prHeadRoot}${path.sep}`)) {
                throw new Error(`Unsafe PR head path: ${filename}`);
              }
              return target;
            };

            for (const file of files) {
              if (file.status === 'removed') continue;
              try {
                const blob = await github.rest.git.getBlob({ owner: headOwner, repo: headRepo, file_sha: file.sha });
                const size = Number(blob.data.size || 0);
                if (size > maxFileBytes || materializedBytes + size > maxTotalBytes) {
                  core.warning(`Skipping full content for ${file.filename}: materialization limit reached.`);
                  continue;
                }
                const targetPath = safeHeadFilePath(file.filename);
                fs.mkdirSync(path.dirname(targetPath), { recursive: true });
                fs.writeFileSync(targetPath, Buffer.from(blob.data.content, blob.data.encoding === 'base64' ? 'base64' : 'utf8'));
                materializedBytes += size;
                materializedHeadFiles.add(file.filename);
              } catch (error) {
                core.warning(`Could not materialize ${file.filename}: ${error.message}`);
              }
            }

            const lines = [];
            const append = (value = '') => lines.push(String(value));
            append('# Pull Request Context');
            append();
            append(`Repository: ${context.repo.owner}/${context.repo.repo}`);
            append(`PR: #${pr.number}`);
            append(`Title: ${pr.title}`);
            append(`Author: ${pr.user?.login || 'unknown'}`);
            append(`Base: ${pr.base.ref} (${pr.base.sha})`);
            append(`Head: ${pr.head.repo.full_name}:${pr.head.ref} (${pr.head.sha})`);
            append();
            append('## Pull Request Body');
            append();
            append(pr.body || '(empty)');
            append();
            append('## Commits');
            for (const commit of commits) append(`- ${commit.sha.slice(0, 12)} ${(commit.commit.message || '').split('\n')[0]}`);
            append();
            append('## Changed Files');
            for (const file of files) append(`- ${file.status}: ${file.filename} (+${file.additions} -${file.deletions})`);
            append();
            append('## Full File Access');
            for (const file of files) {
              append(`- ${file.filename}`);
              append(`  - Base: \`${fs.existsSync(file.filename) ? file.filename : '(absent on base branch)'}\``);
              append(`  - PR head: \`${path.join(process.env.PR_HEAD_PATH, file.filename)}\`${materializedHeadFiles.has(file.filename) ? '' : ' (not materialized; use patch)'}`);
            }
            append();
            append('## Patches');
            let remaining = 140000;
            for (const file of files) {
              append();
              append(`### ${file.filename}`);
              append(`Status: ${file.status}`);
              append(`Changes: +${file.additions} -${file.deletions}`);
              if (!file.patch) {
                append('_No text patch was available._');
                continue;
              }
              if (remaining <= 0) {
                append('_Patch omitted because the PR diff exceeded the workflow context limit._');
                continue;
              }
              const patch = file.patch.slice(0, Math.min(file.patch.length, 18000, remaining));
              remaining -= patch.length;
              append('```diff');
              append(patch);
              if (patch.length < file.patch.length) append(`... truncated ${file.patch.length - patch.length} characters ...`);
              append('```');
            }
            fs.mkdirSync(path.dirname(process.env.CONTEXT_PATH), { recursive: true });
            fs.writeFileSync(process.env.CONTEXT_PATH, `${lines.join('\n')}\n`, 'utf8');

      - name: Run Codex review
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ vars.OPENAI_RESPONSES_API_ENDPOINT }}
          prompt-file: .github/codex/prompts/review.md
          permission-profile: ":read-only"

  publish:
    name: Publish review comment
    needs: review
    if: ${{ needs.review.outputs.final_message != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Publish PR review comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            const review = String(process.env.REVIEW || '').trim();
            if (!review) return;
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Codex PR Review',
              '',
              review,
              '',
              '---',
              `Head: \`${pr.head.sha.slice(0, 12)}\` | [Workflow run](${runUrl})`,
              '',
              '_Generated by GitHub Actions using openai/codex-action._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
